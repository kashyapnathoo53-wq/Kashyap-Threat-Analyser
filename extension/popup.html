<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasha Security Sentinel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="sentinel-container">
    <!-- Header -->
    <header class="sentinel-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" stroke="#00f2fe" fill="rgba(0, 242, 254, 0.1)"/>
            <circle cx="12" cy="12" r="3" fill="#7928ca" stroke="#00f2fe" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">PASHA 2.0</span>
          <span class="brand-sub">SECURITY SENTINEL</span>
        </div>
      </div>
      <div class="header-actions">
        <div id="connectionStatus" class="status-pill status-checking">
          <span class="dot"></span>
          <span class="status-text">CONNECTING</span>
        </div>
        <button id="refreshBtn" class="icon-btn" title="Refresh Telemetry">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Offline Alert Banner (shown when API is unreachable) -->
    <div id="offlineBanner" class="alert-banner hidden">
      <div class="alert-content">
        <span class="alert-icon">⚠️</span>
        <div class="alert-text">
          <strong>Local Engine Offline</strong>
          <span>Start Pasha backend at <code>127.0.0.1:8000</code></span>
        </div>
      </div>
    </div>

    <!-- Main Host Telemetry Card -->
    <section class="telemetry-card">
      <div class="card-glow"></div>
      <div class="telemetry-grid">
        <div class="telemetry-item">
          <span class="item-label">HOST / MACHINE</span>
          <span id="machineId" class="item-value monospace">Loading...</span>
        </div>
        <div class="telemetry-item">
          <span class="item-label">POSTURE STATUS</span>
          <span id="hostPosture" class="item-value highlight-cyan">ACTIVE DEFENSE</span>
        </div>
        <div class="telemetry-item">
          <span class="item-label">SNAPSHOTS</span>
          <span id="snapshotCount" class="item-value monospace">--</span>
        </div>
        <div class="telemetry-item">
          <span class="item-label">ACTIVE THREATS</span>
          <span id="threatQueueCount" class="item-value highlight-pink">--</span>
        </div>
      </div>
    </section>

    <!-- Quick Action Controls -->
    <section class="actions-section">
      <button id="scanHostBtn" class="action-btn btn-primary">
        <span class="btn-icon">⚡</span>
        <span class="btn-text">Execute Host Scan</span>
        <span class="spinner hidden" id="scanSpinner"></span>
      </button>

      <div class="action-row">
        <button id="investigateBtn" class="action-btn btn-secondary">
          <span class="btn-icon">🔍</span>
          <span class="btn-text">Investigate Next</span>
          <span class="spinner hidden" id="invSpinner"></span>
        </button>
        <button id="openDashboardBtn" class="action-btn btn-cyan-outline">
          <span class="btn-icon">🌐</span>
          <span class="btn-text">Console</span>
        </button>
      </div>
    </section>

    <!-- High Priority Candidates Feed -->
    <section class="threats-section">
      <div class="section-header">
        <span class="section-title">PRIORITIZED THREAT CANDIDATES</span>
        <span id="threatBadge" class="badge">0</span>
      </div>

      <div id="candidatesList" class="candidates-container">
        <div class="empty-state">
          <span>Scanning for suspicious candidates...</span>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="sentinel-footer">
      <div class="footer-info">
        <span class="version-label">v2.0.0 Autonomic Core</span>
        <span id="lastUpdated" class="last-sync">Synced just now</span>
      </div>
    </footer>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
